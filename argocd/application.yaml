apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rupesh-jumade/end-to-end-gitops-cloud-platform-aws-eks.git
    targetRevision: main
    path: helm/gitops-platform
    helm:
      parameters:
        - name: image.tag
          value: local

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
