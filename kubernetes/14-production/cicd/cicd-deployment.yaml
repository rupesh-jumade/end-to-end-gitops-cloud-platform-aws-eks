apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-platform-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-platform-app

  template:
    metadata:
      labels:
        app: gitops-platform-app

    spec:
      containers:
        - name: gitops-platform-app
          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
