apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: gitops-platform-ingress

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-platform-service
                port:
                  number: 80

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gitops-platform-service
                port:
                  number: 80
